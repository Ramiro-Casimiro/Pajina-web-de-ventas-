{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <link href="https://cdnjs.cloudfare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel=" "stylesheet>
   
    <title>{% block title %}{% endblock %}</title>
    {% block css %}{% endblock %}
</head>
<body class="app-layout">
    <header>
        {% block header %}
            {% include "Components/navbar.html" %}
        {% endblock %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        {% block footer %}
            {% include "Components/footer.html" %}
        {% endblock %}
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
