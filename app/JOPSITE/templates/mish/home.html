{% block scripts %}
<script>
document.querySelectorAll('.producto').forEach(function (card) {
    const container = card.querySelector('.carousel-container');
    const track = card.querySelector('.carousel-track');
    const prev = card.querySelector('.prev');
    const next = card.querySelector('.next');
    const dotsContainer = card.querySelector('.carousel-dots');

    const images = Array.from(track.querySelectorAll('img'));
    let currentIndex = 0;

    // Crear puntos indicadores automáticamente
    images.forEach(function (_, index) {
        const dot = document.createElement('button');

        dot.type = 'button';
        dot.classList.add('carousel-dot');
        dot.setAttribute('aria-label', 'Mostrar imagen ' + (index + 1));

        dot.addEventListener('click', function () {
            showImage(index);
        });

        dotsContainer.appendChild(dot);
    });

    const dots = Array.from(dotsContainer.querySelectorAll('.carousel-dot'));

    function showImage(index) {
        currentIndex = Math.max(0, Math.min(index, images.length - 1));

        track.scrollTo({
            left: currentIndex * track.clientWidth,
            behavior: 'smooth'
        });

        updateCarousel();
    }

    function updateCarousel() {
        prev.hidden = currentIndex === 0;
        next.hidden = currentIndex === images.length - 1;

        dots.forEach(function (dot, index) {
            dot.classList.toggle('active', index === currentIndex);
            dot.setAttribute(
                'aria-current',
                index === currentIndex ? 'true' : 'false'
            );
        });
    }

    prev.addEventListener('click', function () {
        showImage(currentIndex - 1);
    });

    next.addEventListener('click', function () {
        showImage(currentIndex + 1);
    });

    // Sincronizar los controles si el usuario desliza la imagen
    let scrollTimeout;

    track.addEventListener('scroll', function () {
        clearTimeout(scrollTimeout);

        scrollTimeout = setTimeout(function () {
            currentIndex = Math.round(
                track.scrollLeft / track.clientWidth
            );

            updateCarousel();
        }, 100);
    });

    // Ajustar la posición cuando cambia el tamaño de pantalla
    window.addEventListener('resize', function () {
        track.scrollLeft = currentIndex * track.clientWidth;
    });

    updateCarousel();
});
</script>
{% endblock %}
